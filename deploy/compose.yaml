# Local stand: PostgreSQL, Redis Streams, S3-compatible SeaweedFS (A1.1), the cabinet and its outbox publisher.
# The default services are what `uv run pytest` needs (the tests reset these schemas):
#   docker compose -f deploy/compose.yaml up -d --build --wait
# Profile "full" adds grading (results API and worker), the reference registry and the model gateway, so a
# teacher's DOCX goes all the way to a result. Use it for the frontend and for manual checks, not under pytest:
#   docker compose -f deploy/compose.yaml --profile full up -d --build --wait
# The E2E tests start their own isolated project with this profile (tests/e2e/conftest.py).
# The gateway answers from recorded fixtures (GATEWAY_TRANSPORT=fixture) unless the shell sets
# GATEWAY_TRANSPORT=gigachat and GIGACHAT_AUTH_KEY: the stand and CI never pay for the model by default.
# Ports bind to 127.0.0.1 only and stay below 49152: Windows/Hyper-V often reserves dynamic ports.
# Addresses and test credentials for clients: .env.example in the repository root. Test credentials only.
name: gorky

services:
  cabinet:
    image: gorky-cabinet:dev
    build: &cabinet-build
      context: ..
      dockerfile: deploy/cabinet.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      S3_ENDPOINT_URL: http://seaweedfs:8333
      CABINET_DATABASE_URL: &cabinet-db postgresql+psycopg://gorky_cabinet:gorky_cabinet@postgres:5432/gorky?connect_timeout=3
      CABINET_GRADING_BASE_URL: http://grading:8000
      CABINET_GRADING_SERVICE_TOKEN: stand-cabinet-token
    ports:
      - "127.0.0.1:${CABINET_PORT:-18080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=4).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  grading:
    profiles: [full]
    image: &backend-image gorky-backend:dev
    build: &backend-build
      context: ..
      dockerfile: deploy/backend.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      GRADING_DATABASE_URL: &grading-db postgresql+psycopg://gorky_grading:gorky_grading@postgres:5432/gorky?connect_timeout=3
      # Stand-only token of the cabinet: reads results and reports, applies and publishes teacher edits.
      GRADING_SERVICE_TOKENS: '{"stand-cabinet-token": {"serviceName": "cabinet", "rights": ["checks.read", "reports.read", "checks.edit", "checks.publish"]}}'
      S3_ENDPOINT_URL: http://seaweedfs:8333
    command: ["sh", "-ec", "alembic -c services/grading/alembic.ini upgrade head && exec uvicorn grading.main:createApp --factory --host 0.0.0.0 --port 8000"]
    healthcheck: &api-health
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/openapi.json', timeout=4).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  grading-worker:
    profiles: [full]
    image: *backend-image
    build: *backend-build
    depends_on:
      grading:
        condition: service_healthy
      references:
        condition: service_healthy
      gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GRADING_DATABASE_URL: *grading-db
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://seaweedfs:8333
      GRADING_REFERENCE_URL: http://references:8000
      GRADING_REFERENCE_TOKEN: stand-grading-token
      GRADING_GATEWAY_URL: http://gateway:8000
      GRADING_GATEWAY_TOKEN: stand-grading-token
    command: ["python", "-m", "grading.runner"]
    restart: on-failure

  references:
    profiles: [full]
    image: *backend-image
    build: *backend-build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REFERENCES_DATABASE_URL: &references-db postgresql+psycopg://gorky_references:gorky_references@postgres:5432/gorky?connect_timeout=3
      REFERENCES_SERVICE_TOKENS: '{"stand-grading-token": {"serviceName": "grading", "rights": ["references.request"]}}'
    # The refs schema holds the registry and the gateway tables: this service migrates it for both.
    command: ["sh", "-ec", "alembic -c services/references/alembic.ini upgrade head && exec uvicorn references.registry.main:createApp --factory --host 0.0.0.0 --port 8000"]
    healthcheck: *api-health

  gateway:
    profiles: [full]
    image: *backend-image
    build: *backend-build
    depends_on:
      references:
        condition: service_healthy
    environment:
      GATEWAY_DATABASE_URL: *references-db
      GATEWAY_SERVICE_TOKENS: '{"stand-grading-token": {"serviceName": "grading", "rights": ["model.review"]}}'
      GATEWAY_TRANSPORT: ${GATEWAY_TRANSPORT:-fixture}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
    command: ["uvicorn", "references.gateway.main:createApp", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck: *api-health

  outbox-publisher:
    image: gorky-cabinet:dev
    build: *cabinet-build
    depends_on:
      cabinet:
        condition: service_healthy
    environment:
      CABINET_DATABASE_URL: *cabinet-db
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "cabinet.outboxpublisher"]
    restart: on-failure

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gorky
      POSTGRES_PASSWORD: gorky
      POSTGRES_DB: gorky
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Roles and schemas of the services (A1.2): applied on the first start of an empty volume.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gorky -d gorky"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    # Append-only file: stream messages survive a restart of the stand.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    # 4.05, not 3.97: 3.97 demands Write on the bucket for every signed request, so a read-only key fails (A1.2).
    image: chrislusf/seaweedfs:4.05
    # Master, volume, filer and S3 gateway in one process. S3 keys and the buckets each service may use
    # come from seaweedfs/s3.json (A1.2).
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      # Each bucket takes 7 volumes on its first write. The image entrypoint reserves 1 GB of disk per volume
      # (-master.volumePreallocate): turn that off, so three buckets do not take 21 GB on an empty stand.
      - -volume.max=100
      - -master.volumePreallocate=false
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:${S3_PORT:-18333}:8333"
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 60

  s3-init:
    image: chrislusf/seaweedfs:4.05
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for bucket in sources results artifacts; do
          printf 's3.bucket.create -name %s\n' "$$bucket" | weed shell -master=seaweedfs:9333
          wget -q -O /dev/null "http://seaweedfs:8888/buckets/$$bucket/"
        done

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
