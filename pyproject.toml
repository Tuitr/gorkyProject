[project]
name = "gorky-backend"
version = "0.1.0"
description = "Backend for checking school math work"
requires-python = ">=3.13"
dependencies = ["gorky-contracts"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.13"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["contracts"]

[tool.uv.sources]
gorky-contracts = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
files = ["contracts/contracts", "tests"]
explicit_package_bases = true
mypy_path = "contracts"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
