[project]
name = "gorky-backend"
version = "0.1.0"
description = "Backend for checking school math work"
requires-python = ">=3.13"
dependencies = ["gorky-contracts", "gorky-shared", "gorky-references", "gorky-grading"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.13", "httpx>=0.27", "jsonschema>=4.23", "types-jsonschema>=4.23"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["contracts", "packages/shared", "services/references", "services/grading"]

[tool.uv.sources]
gorky-contracts = { workspace = true }
gorky-shared = { workspace = true }
gorky-references = { workspace = true }
gorky-grading = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]
python_classes = ["Test*"]
python_functions = ["test*"]
addopts = ["--import-mode=importlib", "--strict-markers"]
# Never exclude e2e here: the canonical `uv run pytest` must run the end-to-end scenario too.
markers = ["e2e: end-to-end scenario against the Docker Compose stand (tests/e2e)"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
files = ["contracts/contracts", "packages/shared/shared", "services/references/references", "services/references/migrations", "services/grading/grading", "tests"]
explicit_package_bases = true
mypy_path = "contracts,packages/shared,services/references,services/grading"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
