[project]
name = "gorky-backend"
version = "0.1.0"
description = "Backend for checking school math work"
requires-python = ">=3.13"
dependencies = ["gorky-contracts", "gorky-shared", "gorky-references"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.13", "httpx>=0.27"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["contracts", "packages/shared", "services/references"]

[tool.uv.sources]
gorky-contracts = { workspace = true }
gorky-shared = { workspace = true }
gorky-references = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]
python_classes = ["Test*"]
python_functions = ["test*"]
addopts = ["--import-mode=importlib", "--strict-markers"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
files = ["contracts/contracts", "packages/shared/shared", "services/references/references", "services/references/migrations", "tests"]
explicit_package_bases = true
mypy_path = "contracts,packages/shared,services/references"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
