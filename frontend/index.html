<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1d42" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <title>Spirit Code</title>
  </head>
  <body style="margin:0;background-color:#0f1d42">
    <div id="root"></div>
    <!-- Приложение не загрузилось (сбой сети или модуля) — сообщение вместо белого экрана -->
    <div id="boot-fail" hidden style="max-width:520px;margin:15vh auto;padding:28px;font:16px/1.5 Inter,system-ui,sans-serif;color:#e6edf7;background:#162652;border:1px solid #2d4278;border-radius:20px;text-align:center">
      <h1 style="margin:0 0 8px;font-size:22px">Приложение не загрузилось</h1>
      <p style="margin:0 0 18px;color:#8b9ab8">Проверьте подключение к интернету и обновите страницу.</p>
      <button onclick="location.reload()" style="padding:10px 18px;border:0;border-radius:10px;background:#ff8400;font:600 15px Inter,system-ui,sans-serif;cursor:pointer">Обновить страницу</button>
    </div>
    <script>
      setTimeout(function () {
        var root = document.getElementById('root')
        if (root && !root.childElementCount) document.getElementById('boot-fail').hidden = false
      }, 8000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
