[project]
name = "gorky-contracts"
version = "1.0.0"
description = "Shared v1 contracts: HTTP models, queue events and examples"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "contracts"
module-root = ""
