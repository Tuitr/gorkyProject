name: Cabinet checks

on:
  push:
    branches: [stepan]

permissions:
  contents: read

jobs:
  cabinet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: deploy/compose.yaml
      COMPOSE_PROJECT_NAME: gorky-cabinet-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PORT: "0"
      REDIS_PORT: "0"
      S3_PORT: "0"
      CABINET_PORT: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Start isolated Compose stand
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Set test endpoints
        run: |
          postgresAddress=$(docker compose port postgres 5432)
          redisAddress=$(docker compose port redis 6379)
          s3Address=$(docker compose port seaweedfs 8333)
          cabinetAddress=$(docker compose port cabinet 8000)
          {
            printf 'DATABASE_URL=postgresql+psycopg://gorky:gorky@%s/gorky?connect_timeout=3\n' "$postgresAddress"
            printf 'CABINET_DATABASE_URL=postgresql+psycopg://gorky_cabinet:gorky_cabinet@%s/gorky?connect_timeout=3\n' "$postgresAddress"
            printf 'REFERENCES_DATABASE_URL=postgresql+psycopg://gorky_references:gorky_references@%s/gorky?connect_timeout=3\n' "$postgresAddress"
            printf 'REDIS_URL=redis://%s/0\n' "$redisAddress"
            printf 'S3_ENDPOINT_URL=http://%s\n' "$s3Address"
            printf 'CABINET_PORT=%s\n' "${cabinetAddress##*:}"
          } >> "$GITHUB_ENV"
      - name: Strict type checking
        run: uv run --no-sync mypy
      - name: Cabinet and contract tests
        run: uv run --no-sync pytest -q tests/cabinet tests/contracts
      - name: Cabinet HTTP and Redis/S3 handoff
        run: uv run --no-sync pytest -q tests/infra/testCabinetApi.py tests/infra/testChecksHandoff.py
      - name: Show services on failure
        if: failure()
        run: docker compose ps -a
      - name: Remove the stand for this run
        if: always()
        run: docker compose down --volumes --remove-orphans
