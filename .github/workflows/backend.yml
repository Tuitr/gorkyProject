name: Backend checks

# E6.2: three required stages with separate results. Any failing stage fails the run; nothing is allow-failure.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The developer stand of this run only (E6.1): own project, volumes and free ports.
      COMPOSE_FILE: deploy/compose.yaml
      COMPOSE_PROJECT_NAME: gorky-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PORT: "0"
      REDIS_PORT: "0"
      S3_PORT: "0"
      CABINET_PORT: "0"
      # Never the paid model: the gateway answers from recorded fixtures.
      GATEWAY_TRANSPORT: fixture
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --locked

      - name: "Stage 1: strict typing (mypy)"
        run: uv run --no-sync mypy

      - name: Start the developer stand (storage, cabinet, outbox publisher)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Set test endpoints
        run: |
          postgresAddress=$(docker compose port postgres 5432)
          redisAddress=$(docker compose port redis 6379)
          s3Address=$(docker compose port seaweedfs 8333)
          cabinetAddress=$(docker compose port cabinet 8000)
          {
            printf 'DATABASE_URL=postgresql+psycopg://gorky:gorky@%s/gorky?connect_timeout=3\n' "$postgresAddress"
            printf 'CABINET_DATABASE_URL=postgresql+psycopg://gorky_cabinet:gorky_cabinet@%s/gorky?connect_timeout=3\n' "$postgresAddress"
            printf 'REFERENCES_DATABASE_URL=postgresql+psycopg://gorky_references:gorky_references@%s/gorky?connect_timeout=3\n' "$postgresAddress"
            printf 'GRADING_DATABASE_URL=postgresql+psycopg://gorky_grading:gorky_grading@%s/gorky?connect_timeout=3\n' "$postgresAddress"
            printf 'REDIS_URL=redis://%s/0\n' "$redisAddress"
            printf 'S3_ENDPOINT_URL=http://%s\n' "$s3Address"
            printf 'CABINET_PORT=%s\n' "${cabinetAddress##*:}"
          } >> "$GITHUB_ENV"

      - name: "Stage 2: unit, contract and stand tests"
        run: uv run --no-sync pytest -q -m "not e2e" --junitxml=reports/unit.xml

      - name: "Stage 3: end-to-end scenario (its own isolated full stand)"
        env:
          E2E_LOGS: reports/e2e-stand.log
          E2E_RECORD: reports/e2e-journey.json
        run: uv run --no-sync pytest -q -rs -m e2e --junitxml=reports/e2e.xml
      - name: The end-to-end scenario really ran
        run: |
          uv run --no-sync python - <<'PY'
          import xml.etree.ElementTree as ElementTree
          suite = ElementTree.parse("reports/e2e.xml").getroot().find("testsuite")
          tests, skipped = int(suite.get("tests", 0)), int(suite.get("skipped", 0))
          print(f"e2e: {tests} test(s), {skipped} skipped")
          assert tests >= 1 and skipped == 0, "the E2E stage must run its scenario without skips"
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: reports/
          if-no-files-found: ignore
      - name: Show the developer stand on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 80
      - name: Remove the developer stand of this run
        if: always()
        run: docker compose down --volumes --remove-orphans
