[project]
name = "gorky-grading"
version = "0.1.0"
description = "Developer 2: grading worker, checks and class reports"
requires-python = ">=3.13"
dependencies = [
    "gorky-contracts",
    "gorky-shared",
    "boto3>=1.35",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "redis>=5.2",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pillow>=11.3",
]

[tool.uv.sources]
gorky-contracts = { workspace = true }
gorky-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "grading"
module-root = ""
