[project]
name = "gorky-grading"
version = "0.1.0"
description = "Developer 2: grading worker, checks and class reports"
requires-python = ">=3.13"
dependencies = ["gorky-contracts", "pydantic>=2.9"]

[tool.uv.sources]
gorky-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "grading"
module-root = ""
