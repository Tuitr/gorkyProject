[project]
name = "gorky-cabinet"
version = "0.1.0"
description = "Developer 1: teacher cabinet, uploads and the public /v1 API"
requires-python = ">=3.13"
dependencies = [
    "gorky-contracts",
    "gorky-shared",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "argon2-cffi>=23.1",
    "boto3>=1.35",
    "python-multipart>=0.0.32",
    "redis>=5.2",
    "httpx>=0.27",
]

[tool.uv.sources]
gorky-contracts = { workspace = true }
gorky-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cabinet"
module-root = ""
