[project]
name = "gorky-dataset"
version = "0.1.0"
description = "Developer 1: generator of the annotated mini dataset (DOCX, ZIP and manifest from a seed)"
requires-python = ">=3.13"
dependencies = ["gorky-contracts"]

[tool.uv.sources]
gorky-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dataset"
module-root = ""
